plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Reactive web support for rating endpoint
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Kafka consumer support
    implementation 'org.springframework.kafka:spring-kafka'

    // Spring Statemachine for orchestrating order status transitions
    implementation 'org.springframework.statemachine:spring-statemachine-starter:3.2.1'

    // AWS SDK v2 for DynamoDB
    implementation platform('software.amazon.awssdk:bom:2.25.16')
    implementation 'software.amazon.awssdk:dynamodb'

    // Jackson for JSON serialization
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Reactor core (transitively included by WebFlux; explicitly added for clarity)
    implementation 'io.projectreactor:reactor-core'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

springBoot {
    mainClass = 'com.example.deliveryservice.DeliveryServiceApplication'
}