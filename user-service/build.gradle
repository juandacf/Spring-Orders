plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Reactive web support
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Kafka producer support
    implementation 'org.springframework.kafka:spring-kafka'

    // AWS SDK v2 for DynamoDB
    implementation platform('software.amazon.awssdk:bom:2.25.16')
    implementation 'software.amazon.awssdk:dynamodb'

    // Jackson for JSON serialization
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Reactor core (included transitively by webflux but explicitly added for clarity)
    implementation 'io.projectreactor:reactor-core'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Application main class for Boot plugin
springBoot {
    mainClass = 'com.example.userservice.UserServiceApplication'
}